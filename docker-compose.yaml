# Local Airflow 3 stack: the official docker-compose.yaml trimmed to LocalExecutor + Postgres.
# For local development only: credentials and secrets below are dev defaults.
x-airflow-common: &airflow-common
  build: .
  image: churn-airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Tasks report their state to the API server.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Every container must sign and verify tokens with the same secrets.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-airflow_secret_key}
    # The churn package is mounted, not installed: code changes need no rebuild.
    PYTHONPATH: /opt/airflow/src
    # Business data (split, metrics, churn scores) lives in its own database, apart from Airflow's metadata.
    CHURN_DB_URL: postgresql+psycopg://churn:${CHURN_DB_PASSWORD:-churn}@churn-db/churn
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    # churn.config looks for config/config.yaml next to src/.
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    churn-db:
      condition: service_healthy

services:
  # The business database: the train/hold-out split, the metrics of every run, the churn scores. Exposed on host
  # port 5433 for psql or any SQL client.
  churn-db:
    image: postgres:16
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: ${CHURN_DB_PASSWORD:-churn}
      POSTGRES_DB: churn
    ports:
      - "5433:5432"
    volumes:
      - churn-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "churn"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Churn simulation API on the model the DAG trained: Swagger on http://localhost:8000/docs. The Airflow image already has
  # FastAPI and uvicorn (Airflow 3's API server is built on them); the entrypoint skips Airflow's own start-up.
  churn-api:
    build: .
    image: churn-airflow
    entrypoint: ["python", "-m", "uvicorn", "churn.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONPATH: /opt/airflow/src
    # Read-only: the API only reads the model, the hold-out and the config.
    volumes:
      - ./src:/opt/airflow/src:ro
      - ./config:/opt/airflow/config:ro
      - ./data:/opt/airflow/data:ro
    ports:
      - "8000:8000"
    restart: always

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    # The image entrypoint migrates the metadata DB and creates the admin user, then runs `airflow version`.
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # With LocalExecutor the scheduler also runs the tasks.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  churn-db-volume:
